<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F2E9">
<link rel="manifest" href="manifest.json">
<title>物品收纳管家 · 家庭库存与保质期管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <symbol id="ic-comb" viewBox="0 0 64 64" fill="none" stroke="#25211F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="22" width="40" height="10" rx="5" fill="#FDFBF5"/><path d="M18 32v14M26 32v14M34 32v14M42 32v14"/></symbol>

    <symbol id="ic-bowl" viewBox="0 0 64 64" fill="none" stroke="#25211F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="24" r="3"/><circle cx="34" cy="20" r="3"/><circle cx="41" cy="26" r="3"/><rect x="10" y="30" width="44" height="7" rx="3.5" fill="#FDFBF5"/><path d="M13 37h38c0 10-8 15-19 15s-19-5-19-15z" fill="#ECA08D" stroke-width="3"/></symbol>

    <symbol id="ic-petnest" viewBox="0 0 64 64" fill="none" stroke="#25211F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 42a20 20 0 0 1 40 0z" fill="#FDFBF5" stroke-dasharray="30 7 20 8"/><path d="M12 42h40v4a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z"/><ellipse cx="32" cy="42" rx="10" ry="5.5" fill="#ECA08D" stroke="none" opacity=".85"/></symbol>

</svg>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <span class="logo"><svg class="ic" style="width:32px;height:32px" aria-hidden="true"><use href="#ic-catface"/></svg></span>
      <div class="brand-text">
        <h1>物品收纳管家</h1>
        <p class="slogan">记录家里的小宝贝 · 库存和保质期一目了然</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-cats" class="btn" title="管理类目（添加美妆、宠物、小猫……）">🏷 类目</button>
      <button id="btn-export-json" class="btn" title="导出 JSON 备份文件">导出备份</button>
      <button id="btn-share" class="btn" hidden title="调出系统分享，把备份存到任意位置（手机端可用）">分享备份</button>
      <button id="btn-export-csv" class="btn" title="导出 CSV 表格（可用 Excel 打开）">导出CSV</button>
      <button id="btn-import" class="btn">导入</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="overview">概览</button>
  <button class="tab" data-tab="items">物品列表</button>
</nav>

<div class="container">
  <div id="install-hint" class="install-hint hidden" role="status">
    <span class="hint-emoji">📲</span>
    <span id="install-hint-text" class="hint-text"></span>
    <button type="button" id="install-btn" class="btn primary hint-btn hidden">安装</button>
    <button type="button" id="install-hint-close" class="hint-close" title="不再提示">✕</button>
  </div>
</div>

<main class="container">

  <section id="tab-overview" class="tab-panel active">
    <div id="overview-empty" class="empty hidden">
      <svg class="empty-doodle" viewBox="0 0 120 44" aria-hidden="true"><path d="M8 32q14-6 28-2t30-2 26 2 20-4" fill="none" stroke="#25211F" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 6 22 8 18"/><path d="M92 6l3 6 6.5 1-5.5 4 2 6.5-6-3-6 3 2-6.5-5.5-4 6.5-1z" fill="#ECA08D" stroke="none"/></svg>
      <h2>欢迎使用物品收纳管家</h2>
      <p>记录家里每件物品的数量和保质期，临期自动提醒，<br>再也不怕东西放到过期忘记吃啦。</p>
      <div class="empty-actions">
        <button class="btn primary" id="btn-add-first">＋ 添加第一件物品</button>
        <button class="btn" id="btn-sample">载入示例数据看看</button>
      </div>
    </div>

    <div id="overview-content">
      <div class="stats-grid">
        <div class="stat-card total">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">物品总数</div>
        </div>
        <div class="stat-card warn" data-status="soon" role="button" title="点击查看临期物品">
          <div class="stat-num" id="stat-soon">0</div>
          <div class="stat-label">临期提醒</div>
        </div>
        <div class="stat-card danger" data-status="expired" role="button" title="点击查看过期物品">
          <div class="stat-num" id="stat-expired">0</div>
          <div class="stat-label">已过期</div>
        </div>
        <div class="stat-card info" data-status="low" role="button" title="点击查看库存不足的物品">
          <div class="stat-num" id="stat-low">0</div>
          <div class="stat-label">库存不足</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>保质期提醒</h2>
          <label class="inline-setting">提前
            <input type="number" id="warn-days" class="num-input" min="1" max="365" value="7">
            天内算「临期」
          </label>
        </div>
        <div id="alerts-list" class="alerts-list"></div>
      </div>

      <div class="panel-row">
        <div class="panel">
          <h2>分类统计</h2>
          <div id="chart-category"></div>
        </div>
        <div class="panel">
          <h2>位置分布</h2>
          <div id="chart-location"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-items" class="tab-panel">
    <div class="toolbar">
      <input type="search" id="search" class="search-input" placeholder="🔍 搜索名称 / 分类 / 位置 / 备注">
      <select id="filter-status">
        <option value="all">全部状态</option>
        <option value="ok">保质期正常</option>
        <option value="soon">临期</option>
        <option value="expired">已过期</option>
        <option value="low">库存不足</option>
      </select>
      <select id="filter-category"><option value="all">全部分类</option></select>
      <select id="filter-location"><option value="all">全部位置</option></select>
      <select id="sort">
        <option value="expiry">排序：临期优先</option>
        <option value="created">排序：最近添加</option>
        <option value="name">排序：按名称</option>
        <option value="qty">排序：数量少优先</option>
      </select>
      <span id="item-count" class="count"></span>
    </div>
    <div id="item-list" class="item-list"></div>
    <div id="list-empty" class="empty hidden">
      <svg class="empty-doodle" viewBox="0 0 120 44" aria-hidden="true"><path d="M8 32q14-6 28-2t30-2 26 2 20-4" fill="none" stroke="#25211F" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 6 22 8 18"/><path d="M92 6l3 6 6.5 1-5.5 4 2 6.5-6-3-6 3 2-6.5-5.5-4 6.5-1z" fill="#ECA08D" stroke="none"/></svg>
      <p id="list-empty-text"></p>
    </div>
  </section>

</main>

<button id="fab" class="fab" title="添加物品">＋</button>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">添加物品</h2>
      <button type="button" id="modal-close" class="icon-btn" title="关闭">✕</button>
    </div>
    <form id="item-form" autocomplete="off">
      <div class="form-grid">
        <label class="field span2"><span>名称 *</span>
          <input name="name" required maxlength="50" placeholder="如：纯牛奶 250ml">
        </label>
        <div class="field span2"><span>类目（点选，也可以自己新建）</span>
          <div id="cat-select" class="cat-select"></div>
          <div id="preset-chips" class="preset-chips hidden">
            <span class="preset-title">✨ 常用：</span>
            <div id="preset-chip-list" class="preset-list"></div>
          </div>
        </div>
        <label class="field"><span>存放位置</span>
          <input name="location" list="dl-location" maxlength="20" placeholder="冰箱 / 厨房柜 / 储物间…">
          <datalist id="dl-location"></datalist>
        </label>
        <label class="field"><span>数量 *</span>
          <input name="quantity" type="number" min="0" step="any" value="1" required>
        </label>
        <label class="field"><span>单位</span>
          <input name="unit" maxlength="10" value="个" placeholder="个 / 盒 / 瓶…">
        </label>
        <label class="field"><span>购买日期</span>
          <input name="purchaseDate" type="date">
        </label>
        <label class="field"><span>保质期至</span>
          <input name="expiryDate" type="date">
        </label>
        <label class="field"><span>最低库存提醒</span>
          <input name="minStock" type="number" min="0" step="any" value="0" placeholder="0 = 不提醒">
        </label>
        <label class="field span2"><span>备注</span>
          <textarea name="note" rows="2" maxlength="200" placeholder="品牌、规格、放在第几层…"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" id="btn-cancel" class="btn">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="cat-overlay" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cat-title">
    <div class="modal-head">
      <h2 id="cat-title">🏷 类目管理</h2>
      <button type="button" id="cat-close" class="icon-btn" title="关闭">✕</button>
    </div>
    <p class="cat-tip">点上排表情选图标 → 起个名字 → 添加类目。<br>点下面的类目徽章可以改图标、改名或删除。</p>
    <div id="cat-emoji-picker" class="emoji-picker"></div>
    <div class="cat-add-row">
      <input id="cat-new-name" class="cat-name-input" maxlength="20" placeholder="类目名称，如：美妆 / 宠物 / 小猫">
      <button type="button" id="cat-add-btn" class="btn primary">添加类目</button>
      <button type="button" id="cat-del-btn" class="btn danger-btn hidden">删除</button>
      <button type="button" id="cat-cancel-edit" class="btn hidden">取消编辑</button>
    </div>
    <div id="cat-list" class="cat-list"></div>
    <div class="modal-foot">
      <button type="button" id="cat-done" class="btn primary">完成</button>
    </div>
  </div>
</div>

<div id="toast" class="toast off"></div>

<footer class="app-footer">界面风格参考 <a href="https://github.com/guokaigdg/animal-island-ui" target="_blank" rel="noopener">animal-island-ui</a> 与 crayon-vignette 手绘规范 · 数据仅保存在你的浏览器里，记得偶尔「导出备份」哦</footer>

<script src="app.js"></script>
<script>
// 注册 Service Worker：支持离线使用与「安装为桌面应用」。
// 直接双击打开（file://）时自动跳过，不影响任何功能。
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
