<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#19c8b9">
<link rel="manifest" href="manifest.json">
<title>物品收纳管家 · 家庭库存与保质期管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <span class="deco deco-1">🐱</span>
    <span class="deco deco-2">⭐</span>
    <span class="deco deco-3">🍄</span>
    <span class="deco deco-4">💗</span>
    <span class="deco deco-5">🐰</span>
    <span class="deco deco-6">🌸</span>
    <div class="brand">
      <span class="logo">📦</span>
      <div class="brand-text">
        <h1>物品收纳管家</h1>
        <p class="slogan">记录家里的小宝贝 · 库存和保质期一目了然</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-export-json" class="btn" title="导出 JSON 备份文件">导出备份</button>
      <button id="btn-share" class="btn" hidden title="调出系统分享，把备份存到任意位置（手机端可用）">分享备份</button>
      <button id="btn-export-csv" class="btn" title="导出 CSV 表格（可用 Excel 打开）">导出CSV</button>
      <button id="btn-import" class="btn">导入</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="overview">🏠 概览</button>
  <button class="tab" data-tab="items">📋 物品列表</button>
</nav>

<div class="container">
  <div id="install-hint" class="install-hint hidden" role="status">
    <span class="hint-emoji">📲</span>
    <span id="install-hint-text" class="hint-text"></span>
    <button type="button" id="install-btn" class="btn primary hint-btn hidden">安装</button>
    <button type="button" id="install-hint-close" class="hint-close" title="不再提示">✕</button>
  </div>
</div>

<main class="container">

  <section id="tab-overview" class="tab-panel active">
    <div id="overview-empty" class="empty hidden">
      <div class="empty-emoji">🏠</div>
      <h2>欢迎使用物品收纳管家</h2>
      <p>记录家里每件物品的数量和保质期，临期自动提醒，<br>再也不怕东西放到过期忘记吃啦。</p>
      <div class="empty-actions">
        <button class="btn primary" id="btn-add-first">＋ 添加第一件物品</button>
        <button class="btn" id="btn-sample">载入示例数据看看</button>
      </div>
    </div>

    <div id="overview-content">
      <div class="stats-grid">
        <div class="stat-card total">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">🧺 物品总数</div>
        </div>
        <div class="stat-card warn" data-status="soon" role="button" title="点击查看临期物品">
          <div class="stat-num" id="stat-soon">0</div>
          <div class="stat-label">⏰ 临期提醒</div>
        </div>
        <div class="stat-card danger" data-status="expired" role="button" title="点击查看过期物品">
          <div class="stat-num" id="stat-expired">0</div>
          <div class="stat-label">😵 已过期</div>
        </div>
        <div class="stat-card info" data-status="low" role="button" title="点击查看库存不足的物品">
          <div class="stat-num" id="stat-low">0</div>
          <div class="stat-label">🛒 库存不足</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>⏰ 保质期提醒</h2>
          <label class="inline-setting">提前
            <input type="number" id="warn-days" class="num-input" min="1" max="365" value="7">
            天内算「临期」
          </label>
        </div>
        <div id="alerts-list" class="alerts-list"></div>
      </div>

      <div class="panel-row">
        <div class="panel">
          <h2>📊 分类统计</h2>
          <div id="chart-category"></div>
        </div>
        <div class="panel">
          <h2>📍 位置分布</h2>
          <div id="chart-location"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-items" class="tab-panel">
    <div class="toolbar">
      <input type="search" id="search" class="search-input" placeholder="🔍 搜索名称 / 分类 / 位置 / 备注">
      <select id="filter-status">
        <option value="all">全部状态</option>
        <option value="ok">保质期正常</option>
        <option value="soon">临期</option>
        <option value="expired">已过期</option>
        <option value="low">库存不足</option>
      </select>
      <select id="filter-category"><option value="all">全部分类</option></select>
      <select id="filter-location"><option value="all">全部位置</option></select>
      <select id="sort">
        <option value="expiry">排序：临期优先</option>
        <option value="created">排序：最近添加</option>
        <option value="name">排序：按名称</option>
        <option value="qty">排序：数量少优先</option>
      </select>
      <span id="item-count" class="count"></span>
    </div>
    <div id="item-list" class="item-list"></div>
    <div id="list-empty" class="empty hidden">
      <div class="empty-emoji">🔍</div>
      <p id="list-empty-text"></p>
    </div>
  </section>

</main>

<button id="fab" class="fab" title="添加物品">＋</button>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">添加物品</h2>
      <button type="button" id="modal-close" class="icon-btn" title="关闭">✕</button>
    </div>
    <form id="item-form" autocomplete="off">
      <div class="form-grid">
        <label class="field span2"><span>名称 *</span>
          <input name="name" required maxlength="50" placeholder="如：纯牛奶 250ml">
        </label>
        <label class="field"><span>分类</span>
          <input name="category" list="dl-category" maxlength="20" placeholder="食品 / 药品 / 日用品…">
          <datalist id="dl-category"></datalist>
        </label>
        <label class="field"><span>存放位置</span>
          <input name="location" list="dl-location" maxlength="20" placeholder="冰箱 / 厨房柜 / 储物间…">
          <datalist id="dl-location"></datalist>
        </label>
        <label class="field"><span>数量 *</span>
          <input name="quantity" type="number" min="0" step="any" value="1" required>
        </label>
        <label class="field"><span>单位</span>
          <input name="unit" maxlength="10" value="个" placeholder="个 / 盒 / 瓶…">
        </label>
        <label class="field"><span>购买日期</span>
          <input name="purchaseDate" type="date">
        </label>
        <label class="field"><span>保质期至</span>
          <input name="expiryDate" type="date">
        </label>
        <label class="field"><span>最低库存提醒</span>
          <input name="minStock" type="number" min="0" step="any" value="0" placeholder="0 = 不提醒">
        </label>
        <label class="field span2"><span>备注</span>
          <textarea name="note" rows="2" maxlength="200" placeholder="品牌、规格、放在第几层…"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" id="btn-cancel" class="btn">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast off"></div>

<footer class="app-footer">🐾 界面风格参考 <a href="https://github.com/guokaigdg/animal-island-ui" target="_blank" rel="noopener">animal-island-ui</a> · 数据仅保存在你的浏览器里，记得偶尔「导出备份」哦</footer>

<script src="app.js"></script>
<script>
// 注册 Service Worker：支持离线使用与「安装为桌面应用」。
// 直接双击打开（file://）时自动跳过，不影响任何功能。
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
